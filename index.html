<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image" href="./assets/icon.png">
    <title>Login Page</title>
</head>

<body>
    <style>
        body {
            text-align: center;
            background-color: black;
        }

        #passWord {
            border-color: rgb(0, 185, 0);
            font-size: 40px;
            height: 100px;
            width: 400px;
            margin-top: 280px;
            border-radius: 10px;
            padding: 10px;
            outline: none;
            background-color: black;
            color: rgb(0, 185, 0);
            padding-left: 20px;
        }

        #searchButton {
            font-size: 40px;
            border-color: rgb(0, 185, 0);
            height: 125px;
            width: 150px;
            border-radius: 10px;
            color: rgb(0, 185, 0);
            background-color: black;
        }
    </style>

    <input type="password" id="passWord" placeholder="Enter password">
    <button id="searchButton" type="button" onclick="onLogin()">Click</button>

    <script>
        const user = localStorage.getItem('user');
        if (user !== null) {
            window.location = 'profile.html';
        }

        const users = [
            {
                id: 1,
                firstName: 'Reza',
                passWord: '09120234497'
            },
            {
                id: 2,
                firstName: 'Atena',
                passWord: '09914452275'
            }
        ]

        function onLogin() {
            const passWord = document.getElementById('passWord').value;
            if (passWord !== '') {
                const user = users.find(x => x.passWord === passWord);
                if (user) {
                    alert('Salam' + ' ' + user.firstName);
                    window.location = 'Nft.html';
                } else {
                    alert('password is incorrect!');
                }
            } else {
                alert('password is Empty!');
            }
        }
    </script>
</body>

</html>
